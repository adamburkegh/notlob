[project]
name = "notlob"
version = "0.5.2"
requires-python = ">=3.11"
dependencies = ["lark>=1.2", "pytest>=8", "hypothesis>=6", "ruff>=0.4"]

[project.optional-dependencies]
dev = ["jsonschema>=4"]

[project.scripts]
notlob = "notlob.cli:main"
lob    = "notlob.cli:lob_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notlob*"]

[tool.setuptools.package-data]
notlob = ["docs/LANGUAGE.md", "docs/USER-AGENTS.md", "docs/DESIGN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
